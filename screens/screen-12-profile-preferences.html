     SCREEN 12 / 13 — PROFILE & PREFERENCES

<div class="sim-screen hidden p-space-md space-y-space-md" id="sim-screen-12">

    <button class="p-1 rounded text-on-surface-variant hover:text-primary" onclick="jumpToSimulatorScreen(4)">

    <span class="font-headline-sm text-headline-sm text-primary font-bold">User Settings</span>

    </div>

  <div class="space-y-space-sm">

      <div class="flex items-center justify-between font-body-sm text-body-sm">

    <div class="p-space-sm rounded-lg bg-surface-container-lowest shadow-sm space-y-2">
      <div class="font-label-md text-label-md font-bold text-primary">Data &amp; Privacy</div>

        <span class="font-data-mono text-secondary font-bold">Enabled</span>
